[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-investigation-generator"
version = "0.1.0"
description = "Local synthetic fraud investigation dataset generator"
requires-python = ">=3.11"
dependencies = ["streamlit"]

[project.optional-dependencies]
test = ["pytest", "websockets", "playwright", "pytest-playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_browser: runs a real browser against a live Streamlit server",
]
